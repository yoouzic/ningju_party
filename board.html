<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e222f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%232e222f'/%3E%3Crect x='6' y='2' width='4' height='12' fill='%23f9c22b'/%3E%3Crect x='2' y='6' width='12' height='4' fill='%23f9c22b'/%3E%3Crect x='4' y='4' width='8' height='8' fill='%23f04f78'/%3E%3C/svg%3E">
<title>实时竞速榜 · 前 10 名 | 21届凝聚力晚会</title>
<!-- 大屏页面：投影 / 电视全屏打开，每 2 秒刷新全场成绩。由 server.py 托管时为真实榜单。 -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/font.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pixel-ui.css">
<link rel="stylesheet" href="css/board.css">
</head>
<body>
<header class="topbar">
    <div class="topbar__inner">
        <div class="deco" aria-hidden="true">
            <i class="px-icon" data-icon="star" data-scale="2" style="right:34%;top:16px"></i>
            <i class="px-icon" data-icon="star" data-scale="1" style="right:26%;top:48px;animation-delay:.4s"></i>
            <i class="px-icon" data-icon="lantern" data-scale="3" style="right:8%;top:8px"></i>
        </div>
        <div class="logo"><i class="px-icon" data-icon="trophy" data-scale="4"></i></div>
        <div class="topbar__text">
            <p class="kicker">
                <span>21届凝聚力晚会</span><span>环节 01 · 摇一摇拼手速</span>
                <span class="plate plate--quiet" id="board-mode">连接中</span>
            </p>
            <h1>实时竞速榜 <em>前 10 名</em></h1>
            <p class="lede">前 10 名信息员请到舞台左侧有序领取刮刮乐 ×1 + 小礼物</p>
        </div>
        <div class="player-chip"><span>已上榜</span><b id="board-total">0 人</b></div>
    </div>
</header>

<main class="board">
    <section class="join" aria-label="加入方式">
        <div class="pane">
            <h2 class="sec"><span class="sq sq--yellow" aria-hidden="true"></span>手机扫码或打开地址加入</h2>
            <p class="join-url" id="join-url">正在获取加入地址…</p>
            <p class="sub">手机与电脑连同一 Wi-Fi；主持人可把此地址生成二维码投屏。更新于 <b id="board-time">--:--:--</b></p>
        </div>
        <div class="join__steps">
            <div class="step"><b>1</b>扫码登录</div>
            <div class="step"><b>2</b>摇一摇冲刺</div>
            <div class="step"><b>3</b>上榜领奖</div>
        </div>
    </section>

    <ol class="bigboard" id="big-board" aria-live="polite"></ol>

    <section class="pane prize">
        <i class="px-icon" data-icon="gift" data-scale="3"></i>
        <div>
            <h2 class="sec"><span class="sq sq--pink" aria-hidden="true"></span>奖励规则</h2>
            <p>本环节取竞速积分前 10 名，各发放刮刮乐 1 张 + 小礼物；晚会结尾凭刮刮乐编号参与幸运大抽奖。</p>
        </div>
    </section>
</main>

<footer class="site-footer">
    <span>摇一摇 像素冲刺 · 大屏模式</span>
    <span><a href="index.html">返回玩家页</a></span>
</footer>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/sprites.js"></script>
<script src="js/net.js"></script>
<script src="js/board.js"></script>
</body>
</html>
